[package]
name = "reth-ethereum-engine-primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# reth
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-engine-primitives.workspace = true
reth-payload-primitives.workspace = true

# alloy
alloy-primitives.workspace = true
alloy-eips.workspace = true
alloy-rpc-types-engine.workspace = true

# misc
serde.workspace = true
# reth-v2.8.1 migration: `sha2` was already a dependency when 880ce24ad extended this crate's
# `payload_id`; upstream moved `payload_id` out and dropped it, and 0G's bridge-aware
# `payload_id` here still hashes with it.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["std"]
std = [
    "reth-ethereum-primitives/std",
    "alloy-primitives/std",
    "alloy-eips/std",
    "alloy-rpc-types-engine/std",
    "serde/std",
    "sha2/std",
    "serde_json/std",
    "thiserror/std",
    "reth-engine-primitives/std",
    "reth-primitives-traits/std",
]
